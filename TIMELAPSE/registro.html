<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timelapse - Registro</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="page">
    <header class="header">
        <a href="index.html">
            <img src="./img/LogoCompletoClaro-removebg-preview.png" alt="Timelapse" class="header__logo">
        </a>
        <a href="home.html" class="header__btn">Iniciar sesion</a>
    </header>

    <main class="page__main">
        <section class="card card--form">
            <h1 class="card__title card__title--main">CREAR CUENTA</h1>
            <p class="card__subtitle card__subtitle--main">Únete a Timelapse y comienza a guardar tus recuerdos.</p>
            
            <form class="form">
                <div class="form__group">
                    <label for="nombre" class="form__label">Nombre completo:</label>
                    <input type="text" id="nombre" name="nombre" class="form__input" placeholder="Ej: Juan Pérez" required>
                </div>

                <div class="form__group">
                    <label for="email" class="form__label">Correo electrónico:</label>
                    <input type="email" id="email" name="email" class="form__input" placeholder="ejemplo@correo.com" required>
                </div>

                <div class="form__group">
                    <label for="password" class="form__label">Contraseña:</label>
                    <input type="password" id="password" name="password" class="form__input" placeholder="Mínimo 8 caracteres" required>
                </div>

                <div class="form__group">
                    <label for="confirm-password" class="form__label">Confirmar contraseña:</label>
                    <input type="password" id="confirm-password" name="confirm-password" class="form__input" placeholder="Repite tu contraseña" required>
                </div>

                <div class="form__group">
                    <label for="fecha-nac" class="form__label">Fecha de nacimiento:</label>
                    <input type="date" id="fecha-nac" name="fecha-nac" class="form__input" required>
                </div>

                <hr class="form__separator">

                <a href="home.html" class="btn btn--submit">Registrarse</a>
                <a href="index.html" class="btn btn--cancel">Cancelar</a>
            </form>

            <p class="welcome__text" style="margin-top: 20px;">
                ¿Ya tienes cuenta?
                <a href="iniciar-sesion.html" class="link">Inicia sesión</a>
            </p>
        </section>
    </main>
</body>
</html>
