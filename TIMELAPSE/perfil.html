<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timelapse - Perfil</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="page">
    <header class="header">
        <a href="home.html">
            <img src="./img/LogoCompletoClaro-removebg-preview.png" alt="Timelapse" class="header__logo">
        </a>
        <a href="menu.html">
            <img src="./img/Perfil-removebg-preview.png" alt="Perfil" class="header__profile">
        </a>
    </header>

    <main class="page__main page__main--perfil">
        <section class="card card--perfil">
            <div class="perfil-header">
                <h1 class="perfil-header__title">Perfil</h1>
                <a href="#" class="perfil-header__btn">Editar</a>
            </div>
            
            <div class="perfil-user">
                <div class="perfil-user__avatar">
                    <img src="./img/Perfil.png" alt="Usuario" class="perfil-user__img">
                </div>
                <h2 class="perfil-user__name">Usuario</h2>
                <p class="perfil-user__email">correousuario@gmail.com</p>
            </div>

            <div class="perfil-form">
                <div class="perfil-form__group">
                    <label class="perfil-form__label">Nombre</label>
                    <input type="text" class="perfil-form__input" placeholder="">
                </div>

                <div class="perfil-form__group">
                    <label class="perfil-form__label">Correo</label>
                    <input type="email" class="perfil-form__input" placeholder="">
                </div>

                <div class="perfil-form__group">
                    <label class="perfil-form__label">Contraseña</label>
                    <input type="password" class="perfil-form__input" placeholder="">
                </div>

                <div class="perfil-form__group">
                    <label class="perfil-form__label">Fecha Nac.</label>
                    <input type="date" class="perfil-form__input">
                </div>
            </div>
        </section>
    </main>
</body>
</html>
