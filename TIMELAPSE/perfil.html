<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timelapse - Perfil</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="page">
    <header class="header">
        <a href="home.html">
            <img src="./img/LogoCompletoClaro-removebg-preview.png" alt="Timelapse" class="header__logo">
        </a>
        <a href="menu.html">
            <img src="./img/Perfil-removebg-preview.png" alt="Perfil" class="header__profile">
        </a>
    </header>

    <main class="page__main page__main--perfil">
        <section class="card card--perfil">
            <h1 class="perfil-title">Perfil</h1>
            
            <div class="perfil-user">
                <div class="perfil-user__avatar">
                    <img src="./img/Perfil.png" alt="Usuario" class="perfil-user__img">
                </div>
                <h2 class="perfil-user__name">Usuario</h2>
                <p class="perfil-user__email">correousuario@gmail.com</p>
            </div>

            <div class="perfil-list">
                <div class="perfil-item">
                    <div class="perfil-item__left">
                        <span class="perfil-item__icon">★</span>
                        <span class="perfil-item__label">Nombre</span>
                    </div>
                    <a href="#" class="perfil-item__btn">Editar</a>
                </div>

                <div class="perfil-item">
                    <div class="perfil-item__left">
                        <span class="perfil-item__icon">★</span>
                        <span class="perfil-item__label">Correo</span>
                    </div>
                    <a href="#" class="perfil-item__btn">Editar</a>
                </div>

                <div class="perfil-item">
                    <div class="perfil-item__left">
                        <span class="perfil-item__icon">★</span>
                        <span class="perfil-item__label">Contraseña</span>
                    </div>
                    <a href="#" class="perfil-item__btn">Editar</a>
                </div>

                <div class="perfil-item">
                    <div class="perfil-item__left">
                        <span class="perfil-item__icon">★</span>
                        <span class="perfil-item__label">Fecha Nac.</span>
                    </div>
                    <a href="#" class="perfil-item__btn">Editar</a>
                </div>

                <div class="perfil-item">
                    <div class="perfil-item__left">
                        <span class="perfil-item__icon">★</span>
                        <span class="perfil-item__label">Idioma</span>
                    </div>
                    <a href="#" class="perfil-item__btn">Editar</a>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
