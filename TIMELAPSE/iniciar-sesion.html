<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timelapse - Bienvenido</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="page">
    <header class="header">
        <a href="index.html">
            <img src="./img/LogoCompletoClaro-removebg-preview.png" alt="Timelapse" class="header__logo">
        </a>
    </header>

    <main class="page__main page__main--login">
        <section class="card card--login">
            <h1 class="login__title">BIENVENIDO A<br>TIMELAPSE</h1>
            <p class="login__subtitle">Inicia sesión para acceder a tus cápsulas del tiempo</p>
            
            <form class="form form--login">
                <div class="form__group">
                    <label for="email" class="form__label">Correo electrónico</label>
                    <input type="email" id="email" name="email" class="form__input" placeholder="tu@email.com" required>
                </div>

                <div class="form__group">
                    <label for="password" class="form__label">Contraseña</label>
                    <input type="password" id="password" name="password" class="form__input" placeholder="••••••••" required>
                </div>

                <a href="#" class="login__forgot">¿Olvidaste tu contraseña?</a>

                <a href="home.html" class="btn btn--submit btn--login">Iniciar sesión</a>
            </form>

            <div class="login__divider">
                <span class="login__divider-text">o</span>
            </div>

            <p class="login__register">
                ¿No tienes cuenta?
                <a href="registro.html" class="link">Regístrate aquí</a>
            </p>
        </section>
    </main>

    <footer class="footer">
        <div class="footer__content">
            <nav class="footer__nav">
                <a href="#" class="footer__link">Sobre nosotros</a>
                <a href="#" class="footer__link">Política & Privacidad</a>
                <a href="contacto.html" class="footer__link">Contacto</a>
            </nav>
            <div class="footer__contact">
                <span class="footer__contact-text">+34 111 22 33 44</span>
                <span class="footer__contact-text">tlapse@gmail.com</span>
            </div>
            <nav class="footer__social">
                <a href="#" class="footer__social-link">TikTok</a>
                <a href="#" class="footer__social-link">X</a>
                <a href="#" class="footer__social-link">Facebook</a>
                <a href="#" class="footer__social-link">YouTube</a>
            </nav>
        </div>
    </footer>
</body>
</html>
